name: CI

# Pull requests only: a push to main builds nothing, and only a v* tag
# (release.yml) publishes anything.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      - name: actionlint and zizmor
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/tools/actionlint" -color
          zizmor --persona auditor .github/workflows
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check the Intel macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add x86_64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin --lib --bins

  build:
    uses: ./.github/workflows/build.yml
    with:
      label: pr-${{ github.event.pull_request.number }}
