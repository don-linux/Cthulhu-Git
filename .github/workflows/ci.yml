name: CI

# Pull requests only: a push to main builds nothing, and only a v* tag
# (release.yml) publishes anything.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check the Intel macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add x86_64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin --lib --bins

  build:
    uses: ./.github/workflows/build.yml
    with:
      label: pr-${{ github.event.pull_request.number }}
