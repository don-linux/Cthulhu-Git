name: Release

# The only workflow that publishes. Pushing a tag such as v0.0.1 runs it;
# nothing else does. See docs/HOW-TO-CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: release checks
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag format
        run: |
          set -Eeuo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH, e.g. v0.0.1"
            exit 1
          fi

      - name: Tag matches Cargo.toml
        run: |
          set -Eeuo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Release notes exist
        run: |
          set -Eeuo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing $notes; see docs/HOW-TO-CHANGELOG.md"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main; then
            echo "::error::$TAG points to a commit that is not on main"
            exit 1
          fi

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: zizmor@1.33.1
      - name: actionlint and zizmor
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/tools/actionlint" -color
          zizmor --persona auditor .github/workflows
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ github.ref_name }}

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release assets; tag push is the publish gate (F1/F2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # zizmor: ignore[superfluous-actions] v3.0.4
        with:
          files: dist/*
          name: Cthulhu Git ${{ github.ref_name }}
          # Handwritten notes committed with the tag, not a generated summary.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
