# cargo-mutants: https://mutants.rs/
# cargo test until the two timeout tests stop taking 60 s: the nextest
# `mutants` profile ends a test after 60 s, so the baseline would fail. Then
# switch to test_tool = "nextest" and select its profile with
# NEXTEST_PROFILE=mutants (`profile` here would be a Cargo build profile).
test_tool = "cargo"
exclude_globs = [
    "src/main.rs",
    "src/ui/theme/**",
    "src/ui/icons.rs",
    "src/ui/fonts.rs",
    "src/**/*_tests.rs",
    "src/**/test_support.rs",
]
exclude_re = ["impl (Debug|Display)"]
