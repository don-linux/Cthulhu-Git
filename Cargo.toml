[package.metadata.generate-rpm.requires]
git-core = ">= 2.15"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
"libvulkan.so.1()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
xdg-desktop-portal = "*"
zenity = "*"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Drawing converts between f32 points and integer cells, rows and lanes. The
# values are small and clamped first; checked conversions there would only add noise.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The library has one caller, this package's binary. Each module's error enum
# documents its failures, and every pure function's result is already used.
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unoptimized, rasterizing the in-app logo's SVG filters takes seconds, which
# every UI test that shows the home screen pays. Release builds are unaffected.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3
