[package]
name = "cthulhu-git"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Desktop Git client spike: finds the system git and shows the repository name and current branch."
license = "MIT"
repository = "https://github.com/don-linux/Cthulhu-Git"
publish = false

[dependencies]
dunce = "1.0.5"
eframe = "0.36.2"

[dev-dependencies]
tempfile = "3.27.0"

# build.rs renders assets/icon.svg; none of these end up in the binary.
[build-dependencies]
embed-resource = "3.0.11"
ico = "0.5.0"
resvg = { version = "0.48.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
