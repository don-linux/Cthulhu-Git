[package]
name = "cthulhu-git"
version = "0.0.8"
edition = "2024"
rust-version = "1.100"
description = "Desktop Git client: opens a repository and shows its branch, latest commit and commit history."
license = "MIT"
repository = "https://github.com/don-linux/Cthulhu-Git"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
directories = "6.0.0"
dunce = "1.0.5"
# persistence is not a default feature in eframe 0.37. It remembers the
# window position, restored size, and whether it was maximized.
eframe = { version = "0.37.0", features = ["persistence"] }
# Only for this feature, which eframe does not forward: egui bundles its
# monochrome emoji fonts again, so emoji look the same on every system
# instead of coming from the system's color emoji font.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
# The SVG loader alone: the interface icons and the logo are rendered at the
# size and scale they are drawn at.
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
# Author avatars. Already in the tree through eframe; only these decoders.
# No GIF: its decoder allocates up to 50 MB before image's limits apply.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# The optional GitHub token, in Keychain, Credential Manager or Secret Service.
keyring = "4.2.0"
pollster = "1.0.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
serde_json = "1.0.154"
sha2 = "0.11.2"
# Atomic writes of settings and the avatar cache: unique, exclusive temp files.
tempfile = "3.27.0"
# HTTPS for avatars and the GitHub API: rustls with ring, no OpenSSL.
ureq = "3.5.2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
# keyring's own core: its in-memory mock store stands in for the keychain.
keyring-core = "1.1.0"
proptest = "1.12.0"

# build.rs renders assets/icon.svg for the window icon and the Windows .exe.
# None of these end up in the binary; the resvg in it comes with egui_extras.
[build-dependencies]
embed-resource = "3.0.12"
ico = "0.6.0"
resvg = { version = "0.50.0", default-features = false }

# Linux packages, built by .github/workflows/build.yml. The icons under
# target/icons/ are rendered from assets/icon.svg by that workflow first.
#
# eframe opens the windowing and graphics libraries at run time instead of
# linking them, so dpkg and rpm cannot detect them: they are listed by hand.
[package.metadata.deb]
maintainer = "Fernando Diaz <194445529+don-linux@users.noreply.github.com>"
copyright = "2026 Fernando Diaz / don-linux"
extended-description = """\
A small desktop Git client that uses the Git installed on the machine. Open \
a repository with the system folder dialog or from the recent list to see \
its current branch, latest commit and commit history."""
section = "vcs"
priority = "optional"
depends = "$auto, git (>= 1:2.15), libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libegl1, libwayland-client0, libwayland-egl1"
# The folder dialog goes through the XDG Desktop Portal over D-Bus (libdbus is
# loaded at run time) and falls back to zenity when no portal answers.
recommends = "libvulkan1, libdbus-1-3, xdg-desktop-portal-gtk | xdg-desktop-portal-gnome | xdg-desktop-portal-kde, zenity"
assets = [
    ["target/release/cthulhu-git", "usr/bin/", "755"],
    ["packaging/linux/cthulhu-git.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/cthulhu-git/", "644"],
    ["target/icons/hicolor/16x16/apps/cthulhu-git.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["target/icons/hicolor/22x22/apps/cthulhu-git.png", "usr/share/icons/hicolor/22x22/apps/", "644"],
    ["target/icons/hicolor/24x24/apps/cthulhu-git.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["target/icons/hicolor/32x32/apps/cthulhu-git.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["target/icons/hicolor/48x48/apps/cthulhu-git.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["target/icons/hicolor/64x64/apps/cthulhu-git.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["target/icons/hicolor/128x128/apps/cthulhu-git.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["target/icons/hicolor/256x256/apps/cthulhu-git.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["target/icons/hicolor/512x512/apps/cthulhu-git.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # The binary embeds the fonts and the icons, so their notices ship with the package.
    ["docs/FONTS.md", "usr/share/doc/cthulhu-git/fonts/", "644"],
    ["assets/fonts/aspekta/OFL.txt", "usr/share/doc/cthulhu-git/fonts/aspekta/", "644"],
    ["assets/fonts/departure-mono/OFL.txt", "usr/share/doc/cthulhu-git/fonts/departure-mono/", "644"],
    ["assets/fonts/ibm-plex-sans/OFL.txt", "usr/share/doc/cthulhu-git/fonts/ibm-plex-sans/", "644"],
    ["assets/fonts/inter/OFL.txt", "usr/share/doc/cthulhu-git/fonts/inter/", "644"],
    ["assets/fonts/meslo-lgs-nf/LICENSE.txt", "usr/share/doc/cthulhu-git/fonts/meslo-lgs-nf/", "644"],
    ["assets/fonts/meslo-lgs-nf/NOTICE.txt", "usr/share/doc/cthulhu-git/fonts/meslo-lgs-nf/", "644"],
    ["assets/fonts/obel-mono/OFL.txt", "usr/share/doc/cthulhu-git/fonts/obel-mono/", "644"],
    ["assets/fonts/ubuntu/LICENCE.txt", "usr/share/doc/cthulhu-git/fonts/ubuntu/", "644"],
    ["assets/fonts/ubuntu-mono/LICENCE.txt", "usr/share/doc/cthulhu-git/fonts/ubuntu-mono/", "644"],
    ["assets/fonts/ubuntu-sans/LICENCE.txt", "usr/share/doc/cthulhu-git/fonts/ubuntu-sans/", "644"],
    ["assets/fonts/egui/Hack-Regular.txt", "usr/share/doc/cthulhu-git/fonts/egui/", "644"],
    ["assets/fonts/egui/OFL.txt", "usr/share/doc/cthulhu-git/fonts/egui/", "644"],
    ["assets/fonts/egui/UFL.txt", "usr/share/doc/cthulhu-git/fonts/egui/", "644"],
    ["assets/fonts/egui/emoji-icon-font-mit-license.txt", "usr/share/doc/cthulhu-git/fonts/egui/", "644"],
    ["assets/icons/LICENSE", "usr/share/doc/cthulhu-git/icons/", "644"],
]

[package.metadata.generate-rpm]
summary = "Desktop Git client that shows a repository's branch, latest commit and history"
assets = [
    { source = "target/release/cthulhu-git", dest = "/usr/bin/cthulhu-git", mode = "755" },
    { source = "packaging/linux/cthulhu-git.desktop", dest = "/usr/share/applications/cthulhu-git.desktop", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cthulhu-git/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cthulhu-git/LICENSE", mode = "644" },
    { source = "target/icons/hicolor/16x16/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/16x16/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/22x22/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/22x22/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/24x24/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/24x24/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/32x32/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/32x32/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/48x48/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/48x48/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/64x64/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/64x64/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/128x128/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/128x128/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/256x256/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/256x256/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/512x512/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/512x512/apps/cthulhu-git.png", mode = "644" },
    { source = "docs/FONTS.md", dest = "/usr/share/doc/cthulhu-git/fonts/FONTS.md", mode = "644", doc = true },
    { source = "assets/fonts/aspekta/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/aspekta/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/departure-mono/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/departure-mono/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/ibm-plex-sans/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/ibm-plex-sans/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/inter/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/inter/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/meslo-lgs-nf/LICENSE.txt", dest = "/usr/share/doc/cthulhu-git/fonts/meslo-lgs-nf/LICENSE.txt", mode = "644", doc = true },
    { source = "assets/fonts/meslo-lgs-nf/NOTICE.txt", dest = "/usr/share/doc/cthulhu-git/fonts/meslo-lgs-nf/NOTICE.txt", mode = "644", doc = true },
    { source = "assets/fonts/obel-mono/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/obel-mono/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/ubuntu/LICENCE.txt", dest = "/usr/share/doc/cthulhu-git/fonts/ubuntu/LICENCE.txt", mode = "644", doc = true },
    { source = "assets/fonts/ubuntu-mono/LICENCE.txt", dest = "/usr/share/doc/cthulhu-git/fonts/ubuntu-mono/LICENCE.txt", mode = "644", doc = true },
    { source = "assets/fonts/ubuntu-sans/LICENCE.txt", dest = "/usr/share/doc/cthulhu-git/fonts/ubuntu-sans/LICENCE.txt", mode = "644", doc = true },
    { source = "assets/fonts/egui/Hack-Regular.txt", dest = "/usr/share/doc/cthulhu-git/fonts/egui/Hack-Regular.txt", mode = "644", doc = true },
    { source = "assets/fonts/egui/OFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/egui/OFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/egui/UFL.txt", dest = "/usr/share/doc/cthulhu-git/fonts/egui/UFL.txt", mode = "644", doc = true },
    { source = "assets/fonts/egui/emoji-icon-font-mit-license.txt", dest = "/usr/share/doc/cthulhu-git/fonts/egui/emoji-icon-font-mit-license.txt", mode = "644", doc = true },
