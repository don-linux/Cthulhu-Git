[package]
name = "cthulhu-git"
version = "0.0.3"
edition = "2024"
rust-version = "1.98"
description = "Desktop Git client: opens a repository and shows its branch, latest commit and commit history."
license = "MIT"
repository = "https://github.com/don-linux/Cthulhu-Git"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
directories = "6.0.0"
dunce = "1.0.5"
eframe = "0.36.2"
fontdb = "0.23.0"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
proptest = "1.11.0"
tempfile = "3.27.0"

# build.rs renders assets/icon.svg; none of these end up in the binary.
[build-dependencies]
embed-resource = "3.0.11"
ico = "0.5.0"
resvg = { version = "0.48.1", default-features = false }

# Linux packages, built by .github/workflows/build.yml. The icons under
# target/icons/ are rendered from assets/icon.svg by that workflow first.
#
# eframe opens the windowing and graphics libraries at run time instead of
# linking them, so dpkg and rpm cannot detect them: they are listed by hand.
[package.metadata.deb]
maintainer = "Fernando Diaz <194445529+don-linux@users.noreply.github.com>"
copyright = "2026 Fernando Diaz / don-linux"
extended-description = """\
A small desktop Git client that uses the Git installed on the machine. Open \
a repository with the system folder dialog or from the recent list to see \
its current branch, latest commit and commit history."""
section = "vcs"
priority = "optional"
depends = "$auto, git (>= 1:2.15), libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libegl1, libwayland-client0, libwayland-egl1"
# The folder dialog goes through the XDG Desktop Portal over D-Bus (libdbus is
# loaded at run time) and falls back to zenity when no portal answers.
recommends = "libvulkan1, libdbus-1-3, xdg-desktop-portal-gtk | xdg-desktop-portal-gnome | xdg-desktop-portal-kde, zenity"
assets = [
    ["target/release/cthulhu-git", "usr/bin/", "755"],
    ["packaging/linux/cthulhu-git.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/cthulhu-git/", "644"],
    ["target/icons/hicolor/16x16/apps/cthulhu-git.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["target/icons/hicolor/22x22/apps/cthulhu-git.png", "usr/share/icons/hicolor/22x22/apps/", "644"],
    ["target/icons/hicolor/24x24/apps/cthulhu-git.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["target/icons/hicolor/32x32/apps/cthulhu-git.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["target/icons/hicolor/48x48/apps/cthulhu-git.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["target/icons/hicolor/64x64/apps/cthulhu-git.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["target/icons/hicolor/128x128/apps/cthulhu-git.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["target/icons/hicolor/256x256/apps/cthulhu-git.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["target/icons/hicolor/512x512/apps/cthulhu-git.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
summary = "Desktop Git client that shows a repository's branch, latest commit and history"
assets = [
    { source = "target/release/cthulhu-git", dest = "/usr/bin/cthulhu-git", mode = "755" },
    { source = "packaging/linux/cthulhu-git.desktop", dest = "/usr/share/applications/cthulhu-git.desktop", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cthulhu-git/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cthulhu-git/LICENSE", mode = "644" },
    { source = "target/icons/hicolor/16x16/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/16x16/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/22x22/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/22x22/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/24x24/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/24x24/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/32x32/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/32x32/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/48x48/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/48x48/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/64x64/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/64x64/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/128x128/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/128x128/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/256x256/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/256x256/apps/cthulhu-git.png", mode = "644" },
    { source = "target/icons/hicolor/512x512/apps/cthulhu-git.png", dest = "/usr/share/icons/hicolor/512x512/apps/cthulhu-git.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
git-core = ">= 2.15"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
"libvulkan.so.1()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
xdg-desktop-portal = "*"
zenity = "*"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
